<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SmartPrep AI</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js" defer></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body.auth-body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #192f34;
            font-family: Arial, sans-serif;
            color: white;
            padding: 25px 15px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            display: block;
            text-align: center;
            font-size: 27px;
            font-weight: bold;
            color: #48c78e;
            text-decoration: none;
            margin-bottom: 22px;
        }

        .auth-card {
            background: #203a40;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #36545a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .auth-card h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .auth-card > p {
            text-align: center;
            color: #b6c5c5;
            margin-bottom: 25px;
        }

        form label {
            display: block;
            margin: 14px 0 7px;
            color: #e5eeee;
            font-size: 14px;
        }

        form input {
            width: 100%;
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #456168;
            background: #172f34;
            color: white;
            outline: none;
            font-size: 14px;
        }

        form input:focus {
            border-color: #48c78e;
        }

        form input::placeholder {
            color: #91a5a5;
        }

        input[type="file"] {
            padding: 9px;
        }

        .photo-preview {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 50%;
            margin: 12px auto;
            border: 3px solid #48c78e;
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 7px;
            background: #079653;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #48c78e;
            color: #14272c;
        }

        .message {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }

        .auth-switch {
            text-align: center;
            margin-top: 22px;
            color: #b6c5c5;
            font-size: 14px;
        }

        .auth-switch a {
            color: #48c78e;
            text-decoration: none;
            font-weight: bold;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body class="auth-body">

    <div class="auth-container">

        <a href="index.html" class="logo">
            <i class="fas fa-brain"></i> SmartPrep AI
        </a>

        <div class="auth-card">

            <h2>Create Your Account</h2>
            <p>Start your personalized exam preparation.</p>

            <form id="registerForm">

                <label for="profilePhoto">Profile Photo</label>
                <input type="file" id="profilePhoto" accept="image/*">

               

                <label for="name">Full Name</label>
                <input type="text"
                       id="name"
                       placeholder="Enter your full name"
                       required>

                <label for="email">Email Address</label>
                <input type="email"
                       id="email"
                       placeholder="Enter your email"
                       required>

                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       placeholder="Create password"
                       required
                       minlength="6">

                <label for="confirmPassword">Confirm Password</label>
                <input type="password"
                       id="confirmPassword"
                       placeholder="Confirm password"
                       required>

                <button type="submit" class="btn-primary">
                    Create Account
                </button>

                <p id="authMessage" class="message"></p>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>
    </div>

    <script>
        const profilePhoto = document.getElementById("profilePhoto");
        const photoPreview = document.getElementById("photoPreview");

        profilePhoto.addEventListener("change", function () {
            const file = this.files[0];

            if (file) {
                photoPreview.src = URL.createObjectURL(file);
                photoPreview.hidden = false;
            } else {
                photoPreview.hidden = true;
            }
        });
    </script>

</body>
</html>
