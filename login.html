<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartPrep AI</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js" defer></script>
</head>
<body class="auth-body">

<div class="auth-container">
    <a href="index.html" class="logo"><i class="fas fa-brain"></i> SmartPrep AI</a>

    <div class="auth-card">
        <h2>Welcome Back!</h2>
        <p>Login to continue your preparation.</p>

        <form id="loginForm">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>

            <button type="submit" class="btn btn-primary full-btn">Login</button>

            <p id="authMessage" class="message"></p>
        </form>

        <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
    </div>
</div>

</body>
</html>
